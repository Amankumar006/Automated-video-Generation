<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Flow Backbone: The conduit -->
  <path d="M 50 200 Q 150 100 300 200 T 550 200" fill="none" stroke="#475569" stroke-width="80" stroke-linecap="round" stroke-opacity="0.3"/>
  <path d="M 50 200 Q 150 100 300 200 T 550 200" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Shared Hyperchunks: Unified blocks -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#38BDF8" stroke="#F8FAFC" stroke-width="2"/>
    <rect x="10" y="10" width="20" height="20" rx="2" fill="#F8FAFC" fill-opacity="0.2"/>
  </g>

  <g transform="translate(200, 210)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#F59E0B" stroke="#F8FAFC" stroke-width="2"/>
    <circle cx="20" cy="20" r="10" fill="#F8FAFC" fill-opacity="0.2"/>
  </g>

  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#A855F7" stroke="#F8FAFC" stroke-width="2"/>
    <polyline points="10,30 20,10 30,30" fill="none" stroke="#F8FAFC" stroke-width="3"/>
  </g>

  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="40" height="40" rx="5" fill="#34D399" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#F8FAFC" stroke-width="4"/>
  </g>

  <!-- Alignment Markers (The 'aligns' action visual) -->
  <line x1="120" y1="190" x2="120" y2="210" stroke="#EF4444" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="220" y1="190" x2="220" y2="210" stroke="#EF4444" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="320" y1="180" x2="320" y2="200" stroke="#EF4444" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="420" y1="190" x2="420" y2="210" stroke="#EF4444" stroke-width="2" stroke-dasharray="2 4"/>

  <!-- Stream velocity indicators -->
  <path d="M 50 160 L 70 160 M 60 150 L 60 170" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 520 240 L 540 240 M 530 230 L 530 250" stroke="#F59E0B" stroke-width="2"/>
</svg>