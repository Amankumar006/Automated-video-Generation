<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Video Stream Timeline -->
  <g stroke="#F8FAFC" stroke-width="2" fill="none">
    <line x1="50" y1="100" x2="550" y2="100" stroke-dasharray="8 8" />
    <rect x="50" y="80" width="40" height="40" fill="#EF4444" fill-opacity="0.6" stroke-width="0" />
    <rect x="110" y="80" width="40" height="40" fill="#EF4444" fill-opacity="0.4" stroke-width="0" />
    <rect x="170" y="80" width="40" height="40" fill="#EF4444" fill-opacity="0.2" stroke-width="0" />
  </g>

  <!-- Transition Arrows -->
  <g stroke="#38BDF8" stroke-width="3" fill="none">
    <path d="M 230 100 L 260 150" />
    <path d="M 245 145 L 260 150 L 250 135" />
  </g>

  <!-- Memory Blocks (Temporal Context) -->
  <g stroke="#A855F7" stroke-width="2">
    <rect x="300" y="150" width="60" height="60" rx="5" fill="#A855F7" fill-opacity="0.3" />
    <rect x="380" y="180" width="60" height="60" rx="5" fill="#34D399" fill-opacity="0.3" />
    <rect x="460" y="210" width="60" height="60" rx="5" fill="#F59E0B" fill-opacity="0.3" />
  </g>

  <!-- Streaming Model Focus Indicator -->
  <g stroke="#38BDF8" stroke-width="4">
    <circle cx="330" cy="180" r="15" fill="none" />
    <circle cx="410" cy="210" r="15" fill="none" />
    <circle cx="490" cy="240" r="15" fill="none" />
    <line x1="330" y1="195" x2="330" y2="250" stroke="#38BDF8" />
    <line x1="410" y1="225" x2="410" y2="280" stroke="#38BDF8" />
    <line x1="490" y1="255" x2="490" y2="310" stroke="#38BDF8" />
  </g>

  <!-- Connection to Core Intelligence -->
  <path d="M 330 250 C 330 300, 490 300, 490 310" stroke="#38BDF8" stroke-width="2" fill="none" />
  
  <!-- Flow lines representing context continuity -->
  <polyline points="230 100 230 200 300 200" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
</svg>