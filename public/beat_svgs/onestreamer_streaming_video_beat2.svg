<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer: Muted Slate chalkboard -->
  
  
  <!-- Film Strip Background (The Streaming Video) -->
  <path d="M-50 150 L650 150 M-50 250 L650 250" stroke="#475569" stroke-width="4" stroke-dasharray="20 20"/>
  <rect x="50" y="160" width="80" height="80" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.3"/>
  <rect x="260" y="160" width="80" height="80" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.6"/>
  <rect x="470" y="160" width="80" height="80" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.2"/>

  <!-- Scribe Hand Representation (Geometric abstraction) -->
  <g stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 220 L320 280 L350 270" filter="url(#glow)"/>
    <circle cx="350" cy="270" r="4" fill="#F59E0B"/>
  </g>

  <!-- Memory Logic: Compressed Nodes (Violet) -->
  <g stroke="#A855F7" stroke-width="2" filter="url(#glow)">
    <circle cx="280" cy="200" r="6" fill="#A855F7"/>
    <circle cx="300" cy="200" r="6" fill="#A855F7"/>
    <circle cx="320" cy="200" r="6" fill="#A855F7"/>
    <path d="M280 200 Q300 180 320 200" fill="none"/>
  </g>

  <!-- Event Sequences: Neon Cyan Stream -->
  <path d="M100 200 C 200 150, 400 250, 500 200" stroke="#38BDF8" stroke-width="4" fill="none" stroke-dasharray="10 5" filter="url(#glow)"/>

  <!-- Compression Action: Mint Green Energy Arc -->
  <path d="M300 260 C 350 220, 350 200, 320 200" stroke="#34D399" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Abstract "Fading" effect representation -->
  <line x1="500" y1="180" x2="550" y2="180" stroke="#EF4444" stroke-width="2" opacity="0.5"/>
  <line x1="500" y1="220" x2="540" y2="220" stroke="#EF4444" stroke-width="2" opacity="0.5"/>
</svg>