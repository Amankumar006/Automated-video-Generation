<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Geometric Subspace (Neon Cyan) -->
  <g fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2">
    <circle cx="150" cy="200" r="60"/>
    <circle cx="180" cy="150" r="30"/>
    <circle cx="120" cy="250" r="40"/>
  </g>

  <!-- Right Geometric Subspace (Mint Green) -->
  <g fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="2">
    <circle cx="450" cy="200" r="60"/>
    <circle cx="480" cy="150" r="30"/>
    <circle cx="420" cy="250" r="40"/>
  </g>

  <!-- The Penalty Barrier (Coral/Crimson Energy Field) -->
  <g stroke="#EF4444" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="300" y1="50" x2="300" y2="350"/>
    <!-- Deflection Arrows -->
    <path d="M 280 180 L 250 180 L 265 165" fill="none"/>
    <path d="M 320 220 L 350 220 L 335 235" fill="none"/>
  </g>

  <!-- Data Flow Paths (Subtle connections trying to cross) -->
  <g stroke="#F8FAFC" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <path d="M 210 200 Q 250 180 290 190"/>
    <path d="M 390 200 Q 350 220 310 210"/>
  </g>

  <!-- Node Points (Chalk White) -->
  <g fill="#F8FAFC">
    <circle cx="150" cy="200" r="4"/>
    <circle cx="450" cy="200" r="4"/>
    <circle cx="180" cy="150" r="4"/>
    <circle cx="480" cy="150" r="4"/>
  </g>
</svg>