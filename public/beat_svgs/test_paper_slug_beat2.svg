<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Muted Slate Background -->
  

  <!-- Left Side: Individual Fruits -->
  <g transform="translate(150, 200)">
    <circle cx="-40" cy="-40" r="15" fill="#EF4444" />
    <circle cx="0" cy="-60" r="15" fill="#EF4444" />
    <circle cx="40" cy="-40" r="15" fill="#EF4444" />
    <path d="M-40-55 Q-40-70 -30-70" stroke="#34D399" stroke-width="3" fill="none" />
    <path d="M0-75 Q0-90 10-90" stroke="#34D399" stroke-width="3" fill="none" />
    <path d="M40-55 Q40-70 50-70" stroke="#34D399" stroke-width="3" fill="none" />
  </g>

  <!-- Arrow Transition -->
  <path d="M250 200 L350 200" stroke="#F8FAFC" stroke-width="4" fill="none" stroke-dasharray="8 8" />
  <path d="M340 190 L350 200 L340 210" stroke="#F8FAFC" stroke-width="4" fill="none" />

  <!-- Right Side: Blender/Smoothie -->
  <g transform="translate(450, 200)">
    <!-- Blender Vessel -->
    <path d="M-40 -80 L40 -80 L30 60 L-30 60 Z" stroke="#F8FAFC" stroke-width="3" fill="none" />
    <!-- Smoothie Content -->
    <rect x="-28" y="0" width="56" height="58" fill="#A855F7" />
    <!-- Blades -->
    <line x1="-30" y1="50" x2="30" y2="50" stroke="#38BDF8" stroke-width="4" />
    <line x1="0" y1="20" x2="0" y2="80" stroke="#38BDF8" stroke-width="4" />
    <!-- Mixing Effect -->
    <ellipse cx="0" cy="30" rx="20" ry="5" stroke="#F59E0B" stroke-width="2" fill="none" stroke-opacity="0.6" />
    <ellipse cx="0" cy="15" rx="15" ry="4" stroke="#F59E0B" stroke-width="2" fill="none" stroke-opacity="0.4" />
  </g>

  <!-- Grounding lines -->
  <line x1="50" y1="280" x2="250" y2="280" stroke="#475569" stroke-width="2" />
  <line x1="400" y1="280" x2="500" y2="280" stroke="#475569" stroke-width="2" />
</svg>