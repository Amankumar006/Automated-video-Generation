<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Main Input Conduit -->
    <path d="M 50 200 H 150" stroke="#F8FAFC" stroke-dasharray="8 8"/>
    
    <!-- Bifurcation Point (The Split) -->
    <circle cx="150" cy="200" r="6" fill="#F8FAFC"/>
    
    <!-- Semantic Cloud Track (Top) -->
    <path d="M 150 200 C 200 200 250 100 350 100 H 550" stroke="#38BDF8" filter="url(#glow)"/>
    <g stroke="#38BDF8">
      <ellipse cx="400" cy="100" rx="40" ry="20" stroke-dasharray="4 4"/>
      <ellipse cx="460" cy="80" rx="30" ry="15" stroke-dasharray="4 4"/>
    </g>
    
    <!-- Geometric Grid Track (Bottom) -->
    <path d="M 150 200 C 200 200 250 300 350 300 H 550" stroke="#F59E0B" filter="url(#glow)"/>
    <g stroke="#F59E0B" stroke-width="1.5">
      <line x1="380" y1="280" x2="380" y2="320"/>
      <line x1="420" y1="280" x2="420" y2="320"/>
      <line x1="460" y1="280" x2="460" y2="320"/>
      <line x1="500" y1="280" x2="500" y2="320"/>
      <line x1="360" y1="300" x2="520" y2="300"/>
    </g>

    <!-- Rail Ties / Physical Analogy Reinforcement -->
    <g stroke="#475569" stroke-width="2">
      <line x1="200" y1="185" x2="200" y2="215"/>
      <line x1="250" y1="160" x2="250" y2="240"/>
      <line x1="300" y1="140" x2="300" y2="260"/>
    </g>
    
    <!-- Flow Indicators (Nodes) -->
    <circle cx="100" cy="200" r="4" fill="#34D399"/>
    <circle cx="250" cy="150" r="4" fill="#38BDF8"/>
    <circle cx="250" cy="250" r="4" fill="#F59E0B"/>
    <circle cx="450" cy="100" r="4" fill="#38BDF8"/>
    <circle cx="450" cy="300" r="4" fill="#F59E0B"/>
  </g>
</svg>