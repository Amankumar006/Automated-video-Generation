<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#F8FAFC"/>
    </marker>
  </defs>

  <!-- Background block of marble (abstract rough shape) -->
  <path d="M150 100 L450 100 L420 300 L180 300 Z" fill="#475569" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Sculpted Semantic Latent Shape (The Output) -->
  <path d="M220 150 C 250 120, 350 120, 380 150 C 410 180, 410 250, 380 280 C 350 310, 250 310, 220 280 C 190 250, 190 180, 220 150" fill="#38BDF8" fill-opacity="0.6" stroke="#38BDF8" stroke-width="3"/>

  <!-- Vector Field Flow Arrows -->
  <g stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowhead)">
    <line x1="100" y1="80" x2="160" y2="120"/>
    <line x1="80" y1="200" x2="160" y2="200"/>
    <line x1="120" y1="320" x2="190" y2="280"/>
    <line x1="450" y1="120" x2="390" y2="160"/>
    <line x1="500" y1="200" x2="420" y2="200"/>
    <line x1="480" y1="300" x2="400" y2="260"/>
  </g>

  <!-- Modality Streams (Input Conduits) -->
  <path d="M50 50 Q 150 50, 150 200" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 350 Q 150 350, 150 200" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>

  <!-- Intersection Nodes -->
  <circle cx="150" cy="200" r="8" fill="#EF4444"/>
  <circle cx="150" cy="200" r="12" stroke="#EF4444" stroke-width="2" fill="none"/>
</svg>