<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flowGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Language Stream (Continuous) -->
  <path d="M 50 100 Q 150 80, 250 100 T 450 100" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="100" r="4" fill="#38BDF8"/>
  <circle cx="250" cy="100" r="4" fill="#38BDF8"/>
  <circle cx="450" cy="100" r="4" fill="#38BDF8"/>

  <!-- Visual Stream (Discrete/Broken) -->
  <g stroke="#EF4444" stroke-width="3" fill="none">
    <rect x="50" y="250" width="40" height="40" stroke="#EF4444"/>
    <rect x="110" y="240" width="40" height="50" stroke="#EF4444"/>
    <rect x="170" y="260" width="40" height="30" stroke="#EF4444"/>
    <rect x="230" y="235" width="40" height="55" stroke="#EF4444"/>
    <rect x="290" y="255" width="40" height="35" stroke="#EF4444"/>
  </g>
  
  <!-- The Discrete Tokenizer (The Chopper) -->
  <g stroke="#F59E0B" stroke-width="2">
    <line x1="80" y1="200" x2="80" y2="350"/>
    <line x1="350" y1="200" x2="350" y2="350"/>
    <path d="M 80 200 L 100 180 L 330 180 L 350 200" fill="none"/>
  </g>

  <!-- Merging Flow (Transition) -->
  <path d="M 450 100 L 525 180 M 450 260 L 525 180" stroke="#34D399" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Unified Stream -->
  <path d="M 525 180 Q 560 180, 580 150" stroke="url(#flowGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="580" cy="150" r="6" fill="#34D399"/>
  
  <!-- Ambient Geometry -->
  <line x1="20" y1="360" x2="580" y2="360" stroke="#475569" stroke-width="1"/>
</svg>