<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke="#F8FAFC" stroke-width="2" fill="none">
    <!-- Left Side: Distinct Strawberries -->
    <circle cx="100" cy="150" r="25" fill="#EF4444" stroke="none"/>
    <circle cx="160" cy="120" r="22" fill="#EF4444" stroke="none"/>
    <circle cx="130" cy="200" r="20" fill="#EF4444" stroke="none"/>
    <path d="M100 135 L105 125 M160 105 L165 95 M130 185 L135 175" stroke="#F8FAFC" stroke-width="3"/>
    
    <!-- Arrow -->
    <path d="M250 160 L350 160 M340 150 L360 160 L340 170" stroke="#475569" stroke-width="4"/>

    <!-- Right Side: Blender -->
    <path d="M420 100 L530 100 L510 300 L440 300 Z" fill="#34D399" fill-opacity="0.3" stroke="#34D399" stroke-width="3"/>
    <path d="M410 100 L540 100" stroke="#F8FAFC" stroke-width="4"/>
    <rect x="450" y="300" width="70" height="20" fill="#475569" stroke="none"/>
    
    <!-- Particles inside blender -->
    <circle cx="475" cy="150" r="8" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="495" cy="220" r="6" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="455" cy="250" r="7" fill="#A855F7" filter="url(#glow)"/>
    <circle cx="505" cy="180" r="9" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="465" cy="190" r="5" fill="#34D399" filter="url(#glow)"/>
    
    <!-- Blender Blades -->
    <line x1="475" y1="260" x2="475" y2="290" stroke="#F8FAFC" stroke-width="3"/>
    <line x1="450" y1="275" x2="500" y2="275" stroke="#F8FAFC" stroke-width="3"/>
  </g>
</svg>