<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="flicker">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15"/>
      <animate attributeName="scale" values="5;20;2;15;5" dur="0.8s" repeatCount="indefinite"/>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect x="150" y="50" width="300" height="300" rx="10" stroke="#F8FAFC" stroke-width="4" fill="none"/>
  
  <!-- Flickering/Blurry Object Representation -->
  <g filter="url(#flicker)">
    <path d="M250 150 Q 350 100 400 200 T 300 300 T 200 200 Z" fill="#EF4444" fill-opacity="0.6"/>
    <path d="M260 160 Q 340 110 390 190 T 310 290 T 210 190 Z" fill="#F59E0B" fill-opacity="0.4"/>
  </g>

  <!-- Crisp Outlines (Target State) -->
  <path d="M250 150 Q 350 100 400 200 T 300 300 T 200 200 Z" stroke="#34D399" stroke-width="3" fill="none" stroke-dasharray="10 5"/>

  <!-- AI Learner Entity (Abstract Geometric Projector) -->
  <g transform="translate(100, 200)">
    <circle cx="0" cy="0" r="20" fill="#38BDF8"/>
    <polyline points="20 0, 150 100, 150 -100, 20 0" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-width="2"/>
    <line x1="20" y1="0" x2="150" y2="0" stroke="#38BDF8" stroke-width="4" stroke-dasharray="5 5"/>
  </g>

  <!-- Light Source Indicators -->
  <g stroke="#F8FAFC" stroke-width="2">
    <line x1="300" y1="20" x2="280" y2="40"/>
    <line x1="300" y1="20" x2="320" y2="40"/>
    <circle cx="300" cy="15" r="5" fill="#F59E0B"/>
  </g>
</svg>