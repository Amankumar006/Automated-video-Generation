<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <rect x="150" y="50" width="300" height="300" fill="#1e293b" stroke="#475569" stroke-width="2" />
  
  <g opacity="0.6">
    <path d="M220 120 Q 300 100 380 120 T 380 280 T 220 280 Z" 
          fill="none" stroke="#EF4444" stroke-width="12" filter="url(#blur)">
      <animate attributeName="opacity" values="0.2;0.8;0.3" dur="0.8s" repeatCount="indefinite" />
    </path>
    <path d="M250 150 L 350 150 M 250 200 L 350 200 M 250 250 L 350 250" 
          stroke="#F59E0B" stroke-width="8" filter="url(#blur)">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="0.5s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(150, 50)">
    <path d="M70 70 L 230 70 L 230 230 L 70 230 Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 8" />
    <path d="M150 50 L 150 250 M 50 150 L 250 150" stroke="#34D399" stroke-width="1" opacity="0.4" />
    <circle cx="150" cy="150" r="40" fill="none" stroke="#A855F7" stroke-width="4" />
    <circle cx="150" cy="150" r="60" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <g stroke="#F8FAFC" stroke-width="2">
    <line x1="50" y1="200" x2="130" y2="200" />
    <polyline points="130 190, 140 200, 130 210" fill="none" />
  </g>
</svg>