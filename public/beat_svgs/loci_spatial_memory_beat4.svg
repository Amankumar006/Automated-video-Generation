<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Muted Slate Background Grid (Spatial Context) -->
  <g stroke="#475569" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <!-- Stored Memory Dots (The Loci) -->
  <g fill="#F59E0B" filter="url(#glow)">
    <circle cx="200" cy="120" r="4"/>
    <circle cx="350" cy="180" r="4"/>
    <circle cx="450" cy="100" r="4"/>
    <circle cx="250" cy="280" r="4"/>
    <circle cx="400" cy="300" r="4"/>
  </g>

  <!-- Projective Geometry Rays (Neon Cyan) -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8">
    <line x1="50" y1="350" x2="200" y2="120"/>
    <line x1="50" y1="350" x2="350" y2="180"/>
    <line x1="50" y1="350" x2="450" y2="100"/>
    <line x1="50" y1="350" x2="250" y2="280"/>
  </g>

  <!-- The Camera Aperture (Chalk White) -->
  <polygon points="30,370 70,370 50,330" fill="none" stroke="#F8FAFC" stroke-width="2"/>
  
  <!-- Active Memory Query Connection (Mint Green) -->
  <g stroke="#34D399" stroke-width="2">
    <line x1="50" y1="350" x2="350" y2="180" stroke-dasharray="4 4"/>
    <circle cx="350" cy="180" r="8" fill="none" stroke="#34D399"/>
  </g>

  <!-- Noise Scraping Field (Violet arc) -->
  <path d="M 400 150 A 60 60 0 1 0 400 250" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Scraping deflection lines -->
  <line x1="420" y1="160" x2="440" y2="140" stroke="#EF4444" stroke-width="1"/>
  <line x1="420" y1="240" x2="440" y2="260" stroke="#EF4444" stroke-width="1"/>
</svg>