name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python tests and Manim smoke render
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            texlive-latex-extra texlive-fonts-recommended dvisvgm espeak-ng

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest is a contributor/CI tool, not a runtime dependency.
          python -m pip install "pytest>=8,<9"

      - name: Verify contributor environment
        run: |
          set -euo pipefail
          python scripts/doctor.py --strict

      - name: Run Python Test Suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run Manim Render Smoke Test
        if: always()
        run: |
          set -euo pipefail
          manim -ql -s -r 540,960 --fps 15 \
            test/test_code_execution_engine.py TestChalkboardCodeBlockScene

  frontend-validation:
    name: Frontend typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck TypeScript
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          set -euo pipefail
          npm test

      - name: Run ESLint
        run: |
          set -euo pipefail
          npm run lint
