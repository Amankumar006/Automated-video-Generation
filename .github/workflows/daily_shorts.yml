name: Autonomous Daily Shorts Daemon

on:
  schedule:
    # 5 Staggered Daily Reel Drops at Peak Viewership Hours (UTC):
    # 03:00 UTC = 08:30 AM IST (Morning drop)
    # 07:00 UTC = 12:30 PM IST (Midday lunch drop)
    # 11:00 UTC = 04:30 PM IST (Afternoon drop)
    # 14:00 UTC = 07:30 PM IST (Evening peak drop)
    # 17:00 UTC = 10:30 PM IST (Late evening nightcap)
    - cron: '0 3,7,11,14,17 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of reels to produce'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      dry_run:
        description: 'Dry run (Scrape and evaluate without rendering)'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube upload privacy'
        required: false
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - private
          - public

jobs:
  produce-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            texlive-latex-extra texlive-fonts-recommended dvisvgm espeak-ng

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
          YOUTUBE_CLIENT_SECRETS_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_BASE64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "GEMINI_MODEL_NAME=gemini-3.1-flash-lite" >> .env

          if [ -n "$YOUTUBE_TOKEN_JSON_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_JSON_BASE64" | base64 -d > pipeline/youtube_token.json
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRETS_BASE64" | base64 -d > pipeline/client_secrets.json
          fi

      - name: Run Daily Shorts Daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 pipeline/daily_shorts_daemon.py --dry-run --count "$COUNT"
          else
            PRIVACY="${{ github.event.inputs.privacy || 'unlisted' }}"
            python3 pipeline/daily_shorts_daemon.py --run-now --count "$COUNT" --privacy "$PRIVACY"
          fi

      - name: Commit & Push Daily Production Logs
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/daemon_logs pipeline/templates public/math_svgs
          git add -A pipeline/digest_history.json public/daemon_logs/ pipeline/templates/ public/math_svgs/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daemon): update daily production log [skip ci]" && git push)
