name: Autonomous Daily Shorts Daemon

permissions:
  contents: read

concurrency:
  group: daily-shorts-production
  cancel-in-progress: false

on:
  schedule:
    # Audience experiment cadence: one public learning slot per weekday.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of reels to produce'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      arxiv_id:
        description: 'Specific arXiv ID or URL (optional, e.g. 2401.12345)'
        required: false
        default: ''
        type: string
      quality:
        description: 'Render quality profile'
        required: false
        default: 'qm'
        type: choice
        options:
          - 'qm'
          - 'qh'
          - 'ql'
      dry_run:
        description: 'Dry run (Scrape and evaluate without rendering)'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube upload privacy'
        required: false
        default: 'unlisted'
        type: choice
        options:
          - public
          - unlisted
          - private
      allow_public:
        description: 'Explicitly allow a public YouTube upload (requires privacy=public)'
        required: false
        default: false
        type: boolean
      publish_instagram:
        description: 'Cross-post to Instagram Reels'
        required: false
        default: false
        type: boolean
      publish_x:
        description: 'Cross-post 4-tweet video thread to X (Twitter)'
        required: false
        default: false
        type: boolean
      publish_linkedin:
        description: 'Cross-post to LinkedIn'
        required: false
        default: false
        type: boolean
      source:

        description: 'Candidate source: mixed (audience-led rotation), arxiv, blogs, perks, github, models'
        required: false
        default: 'mixed'
        type: choice
        options:
          - mixed
          - arxiv
          - blogs
          - perks
          - github
          - models

jobs:
  preflight:
    name: Validate production inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Validate workflow inputs
        env:
          COUNT: ${{ github.event.inputs.count || '1' }}
          QUALITY: ${{ github.event.inputs.quality || 'qm' }}
          REQUESTED_PRIVACY: ${{ github.event.inputs.privacy || 'unlisted' }}
          REQUESTED_ALLOW_PUBLIC: ${{ github.event.inputs.allow_public || 'false' }}
          ENABLE_PUBLIC_AUTOPUBLISH: ${{ vars.ENABLE_PUBLIC_AUTOPUBLISH || 'false' }}
          PUBLISH_INSTAGRAM: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.publish_instagram || 'false' }}
          PUBLISH_X: ${{ github.event.inputs.publish_x || 'false' }}
          PUBLISH_LINKEDIN: ${{ github.event.inputs.publish_linkedin || 'false' }}
          SOURCE: ${{ github.event.inputs.source || 'mixed' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          PRIVACY="$REQUESTED_PRIVACY"
          ALLOW_PUBLIC="$REQUESTED_ALLOW_PUBLIC"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$ENABLE_PUBLIC_AUTOPUBLISH" = "true" ]; then
            PRIVACY=public
            ALLOW_PUBLIC=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$ENABLE_PUBLIC_AUTOPUBLISH" != "true" ]; then
            echo "Scheduled experiment publishing is disabled. Set repository variable ENABLE_PUBLIC_AUTOPUBLISH=true after credentials and gates are verified." >&2
            exit 1
          fi

          case "$COUNT" in 1|2|3|4|5) ;; *) echo "Invalid count: $COUNT" >&2; exit 1 ;; esac
          case "$QUALITY" in qm|qh|ql) ;; *) echo "Invalid quality: $QUALITY" >&2; exit 1 ;; esac
          case "$PRIVACY" in public|unlisted|private) ;; *) echo "Invalid privacy: $PRIVACY" >&2; exit 1 ;; esac
          case "$SOURCE" in mixed|arxiv|blogs|perks|github|models) ;; *) echo "Invalid source: $SOURCE" >&2; exit 1 ;; esac

          for flag in "$ALLOW_PUBLIC" "$PUBLISH_INSTAGRAM" "$PUBLISH_X" "$PUBLISH_LINKEDIN" "$DRY_RUN"; do
            case "$flag" in true|false|'') ;; *) echo "Invalid boolean input: $flag" >&2; exit 1 ;; esac
          done

          if [ "$PRIVACY" = "public" ] && [ "$ALLOW_PUBLIC" != "true" ]; then
            echo "Public uploads require the explicit allow_public=true opt-in." >&2
            exit 1
          fi

          echo "Preflight passed: privacy=$PRIVACY, public_opt_in=$ALLOW_PUBLIC, instagram=$PUBLISH_INSTAGRAM, x=$PUBLISH_X, linkedin=$PUBLISH_LINKEDIN, dry_run=$DRY_RUN"

  produce-short:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            texlive-latex-extra texlive-fonts-recommended dvisvgm espeak-ng

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Phonon TTS runtime
        run: |
          set -euo pipefail
          ptts --version
          ptts --build-info

      - name: Configure Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_TOKEN_JSON_BASE64: ${{ secrets.YOUTUBE_TOKEN_JSON_BASE64 }}
          YOUTUBE_CLIENT_SECRETS_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_BASE64 }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          mask_secret() {
            if [ -n "${1:-}" ]; then
              printf '::add-mask::%s\n' "$1"
            fi
          }

          mask_secret "$GEMINI_API_KEY"
          mask_secret "$ELEVENLABS_API_KEY"
          mask_secret "$SARVAM_API_KEY"
          mask_secret "$GROQ_API_KEY"
          mask_secret "$OPENROUTER_API_KEY"
          mask_secret "$YOUTUBE_TOKEN_JSON_BASE64"
          mask_secret "$YOUTUBE_CLIENT_SECRETS_BASE64"
          mask_secret "$INSTAGRAM_ACCESS_TOKEN"
          mask_secret "$TWITTER_API_KEY"
          mask_secret "$TWITTER_API_SECRET"
          mask_secret "$TWITTER_ACCESS_TOKEN"
          mask_secret "$TWITTER_ACCESS_TOKEN_SECRET"
          mask_secret "$TWITTER_CLIENT_ID"
          mask_secret "$TWITTER_CLIENT_SECRET"
          mask_secret "$LINKEDIN_CLIENT_ID"
          mask_secret "$LINKEDIN_CLIENT_SECRET"
          mask_secret "$LINKEDIN_ACCESS_TOKEN"

          : > .env
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          printf '%s\n' \
            'GEMINI_MODEL_NAME=gemini-2.5-flash' \
          'VISUAL_GENERATION_MODE=on_demand' \
          'ENABLE_BESPOKE_VISUALS=true' \
            'TTS_PROVIDER=phonon' \
            'PHONON_TTS_MODEL=hf://gradium/phonon-31m-en' \
            'PHONON_TTS_LANGUAGE=en' \
            'PHONON_TTS_QUANT=q8_0' \
            'PHONON_TTS_TIMEOUT_SECONDS=180' \
            'FAIL_ON_TTS_PROVIDER_FALLBACK=true' \
            'REQUIRE_VLM_QA=true' \
            'ALLOW_VLM_PROVIDER_OUTAGE_PUBLISH=false' \
            'FAIL_ON_PUBLISH_ERROR=true' \
            'VLM_CRITIC_TIMEOUT_SECONDS=45' \
            'VLM_CRITIC_BATCH_TIMEOUT_SECONDS=300' \
            'ELEVENLABS_VOICE=eric' >> .env

          if [ -n "$GROQ_API_KEY" ]; then
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> .env
          fi

          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> .env
          fi

          if [ -n "$ELEVENLABS_API_KEY" ]; then
            printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" >> .env
          fi

          if [ -n "$SARVAM_API_KEY" ]; then
            printf 'SARVAM_API_KEY=%s\n' "$SARVAM_API_KEY" >> .env
          fi

          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            printf 'INSTAGRAM_ACCESS_TOKEN=%s\n' "$INSTAGRAM_ACCESS_TOKEN" >> .env
            printf 'INSTAGRAM_ACCOUNT_ID=%s\n' "${INSTAGRAM_ACCOUNT_ID:-17841425926885618}" >> .env
          fi

          if [ -n "$TWITTER_API_KEY" ]; then
            printf '%s\n' \
              "TWITTER_API_KEY=$TWITTER_API_KEY" \
              "TWITTER_API_SECRET=$TWITTER_API_SECRET" \
              "TWITTER_ACCESS_TOKEN=$TWITTER_ACCESS_TOKEN" \
              "TWITTER_ACCESS_TOKEN_SECRET=$TWITTER_ACCESS_TOKEN_SECRET" \
              "TWITTER_CLIENT_ID=$TWITTER_CLIENT_ID" \
              "TWITTER_CLIENT_SECRET=$TWITTER_CLIENT_SECRET" >> .env
          fi

          if [ -n "$LINKEDIN_ACCESS_TOKEN" ]; then
            printf '%s\n' \
              "LINKEDIN_ACCESS_TOKEN=$LINKEDIN_ACCESS_TOKEN" \
              "LINKEDIN_CLIENT_ID=$LINKEDIN_CLIENT_ID" \
              "LINKEDIN_CLIENT_SECRET=$LINKEDIN_CLIENT_SECRET" >> .env
          fi

          if [ -n "$YOUTUBE_TOKEN_JSON_BASE64" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON_BASE64" | base64 --decode > pipeline/youtube_token.json
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_BASE64" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRETS_BASE64" | base64 --decode > pipeline/client_secrets.json
          fi

      - name: Run Daily Shorts Daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
          REQUIRE_VLM_QA: "true"
          ALLOW_VLM_PROVIDER_OUTAGE_PUBLISH: "false"
          FAIL_ON_PUBLISH_ERROR: "true"
          VLM_CRITIC_TIMEOUT_SECONDS: "45"
          VLM_CRITIC_BATCH_TIMEOUT_SECONDS: "300"
          CONTENT_STRATEGY_MODE: "audience_led"
          CONTENT_STRATEGY_INCLUDE_GITHUB: "true"
          CONTENT_STRATEGY_INCLUDE_HF_MODELS: "true"
          AUDIENCE_PROFILE: "global_ai_builder"
          EXPERIMENT_ID: "global_builder_20_video"
          EXPERIMENT_TARGET_VIDEOS: "20"
          EXPERIMENT_VIDEOS_PER_WEEK: "5"
          EXPERIMENT_PRIMARY_PLATFORM: "youtube"
          EXPERIMENT_SUCCESS_METRIC: "qualified_growth"
          EXPERIMENT_CROSSPOST_POLICY: "winners_only"
          TTS_PROVIDER: "phonon"
          VISUAL_GENERATION_MODE: "on_demand"
          ENABLE_BESPOKE_VISUALS: "true"
          PHONON_TTS_MODEL: "hf://gradium/phonon-31m-en"
          PHONON_TTS_LANGUAGE: "en"
          PHONON_TTS_QUANT: "q8_0"
          PHONON_TTS_TIMEOUT_SECONDS: "180"
          FAIL_ON_TTS_PROVIDER_FALLBACK: "true"
          COUNT: ${{ github.event.inputs.count || '1' }}
          QUALITY: ${{ github.event.inputs.quality || 'qm' }}
          ARXIV_ID: ${{ github.event.inputs.arxiv_id || '' }}
          REQUESTED_PRIVACY: ${{ github.event.inputs.privacy || 'unlisted' }}
          REQUESTED_ALLOW_PUBLIC: ${{ github.event.inputs.allow_public || 'false' }}
          ENABLE_PUBLIC_AUTOPUBLISH: ${{ vars.ENABLE_PUBLIC_AUTOPUBLISH || 'false' }}
          PUBLISH_INSTAGRAM: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.publish_instagram || 'false' }}
          PUBLISH_X: ${{ github.event.inputs.publish_x || 'false' }}
          PUBLISH_LINKEDIN: ${{ github.event.inputs.publish_linkedin || 'false' }}
          SOURCE: ${{ github.event.inputs.source || 'mixed' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          PRIVACY="$REQUESTED_PRIVACY"
          ALLOW_PUBLIC="$REQUESTED_ALLOW_PUBLIC"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$ENABLE_PUBLIC_AUTOPUBLISH" = "true" ]; then
            PRIVACY=public
            ALLOW_PUBLIC=true
          fi
          EXTRA_ARGS=(--source "$SOURCE")
          if [ -n "$ARXIV_ID" ]; then
            EXTRA_ARGS+=(--arxiv "$ARXIV_ID")
          fi

          if [ "$PRIVACY" = "public" ] && [ "$ALLOW_PUBLIC" != "true" ]; then
            echo "Public uploads require the explicit allow_public=true opt-in." >&2
            exit 1
          fi

          if [ "$PUBLISH_INSTAGRAM" = "true" ]; then
            if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
              echo "Instagram publishing was explicitly requested but INSTAGRAM_ACCESS_TOKEN is unavailable." >&2
              exit 1
            fi
            EXTRA_ARGS+=(--publish-instagram)
          fi

          if [ "$PUBLISH_X" = "true" ]; then
            if [ -z "$TWITTER_API_KEY" ]; then
              echo "X publishing was explicitly requested but TWITTER_API_KEY is unavailable." >&2
              exit 1
            fi
            EXTRA_ARGS+=(--publish-x)
          fi

          if [ "$PUBLISH_LINKEDIN" = "true" ]; then
            if [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
              echo "LinkedIn publishing was explicitly requested but LINKEDIN_ACCESS_TOKEN is unavailable." >&2
              exit 1
            fi
            EXTRA_ARGS+=(--publish-linkedin)
          fi

          if [ "$DRY_RUN" = "true" ]; then
            python3 pipeline/daily_shorts_daemon.py --dry-run --count "$COUNT" "${EXTRA_ARGS[@]}"
          else
            python3 pipeline/daily_shorts_daemon.py --run-now --count "$COUNT" --privacy "$PRIVACY" --quality "$QUALITY" "${EXTRA_ARGS[@]}"
          fi

      - name: Upload Daily Production State
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-production-state-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            public/**
            pipeline/digest_history.json
            pipeline/templates/**
            data/**

      - name: Remove Credentials From Runner
        if: always()
        run: |
          rm -f .env pipeline/youtube_token.json pipeline/client_secrets.json

  validate-production-state:
    name: Validate production state artifact
    if: needs.produce-short.result == 'success'
    needs: produce-short
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download Daily Production State
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-production-state-${{ github.run_id }}
          path: .

      - name: Validate allowlisted state
        run: |
          set -euo pipefail

          for required_path in public pipeline/digest_history.json pipeline/templates data; do
            if [ ! -e "$required_path" ]; then
              echo "Missing required production state path: $required_path" >&2
              exit 1
            fi
          done

          public_file="$(find public -type f -print -quit)"
          if [ -z "$public_file" ]; then
            echo "Production state contains no public files." >&2
            exit 1
          fi

          credential_file="$(find . -type f \( -name '.env' -o -name 'youtube_token.json' -o -name 'client_secrets.json' \) -print -quit)"
          if [ -n "$credential_file" ]; then
            echo "Credential material was included in the production state artifact." >&2
            exit 1
          fi

          echo "Production state artifact passed integrity and credential checks."

  persist-production-state:
    if: needs.produce-short.result == 'success' && needs.validate-production-state.result == 'success'
    needs:
      - produce-short
      - validate-production-state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout main for production state persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Synchronize main before applying production state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth_header" fetch origin main
          git reset --hard origin/main

      - name: Download Daily Production State
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-production-state-${{ github.run_id }}
          path: .

      - name: Commit and Push Allowlisted Production State
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for path in public pipeline/digest_history.json pipeline/templates data; do
            if [ -e "$path" ]; then
              git add -A -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            exit 0
          fi

          if ! git diff --cached --check; then
            echo "Warning: generated production state contains whitespace diagnostics; continuing with the allowlisted state commit."
          fi
          git commit -m "chore(daemon): update daily production & analytics logs [skip ci]"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth_header" push origin HEAD:main
