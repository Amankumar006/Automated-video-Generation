name: Bug report
description: Report a reproducible problem in the pipeline, renderer, studio, or contributor setup.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, OAuth tokens, private URLs, and generated media before submitting logs.
  - type: input
    id: command
    attributes:
      label: Reproduction command
      description: What exact command or workflow reproduces the issue?
      placeholder: python3 pipeline/run_pipeline.py --dry-run
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Node, Manim, and the relevant `make doctor` output.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste the smallest useful log excerpt. Remove credentials and personal paths.
      render: shell
